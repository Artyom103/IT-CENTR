<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главный</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #2d395a;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            position: relative;
        }

        /* Стили для навигационного меню */
        .nav-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .menu-item {
            display: inline-block;
            position: relative;
            margin-left: 20px;
        }

        .menu-btn {
            padding: 12px 25px;
            background: #3373e9;
            color: #fff;
            border: 2px solid white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #2d395a;
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px;
            min-width: 200px;
        }

        .menu-item:hover .submenu {
            display: block;
        }

        .submenu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .submenu a:hover {
            background: #3373e9;
        }

        .content {
            max-width: 800px;
            margin: 100px auto 50px;
            text-align: center;
        }

        .main-photo {
            width: 600px;
            height: 400px;
            object-fit: cover;
            border: 4px solid #f9f9fc;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer-text {
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .main-photo {
                width: 90%;
                height: auto;
            }
            .nav-menu {
                top: 10px;
                right: 10px;
            }
            .menu-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Навигационное меню -->
    <nav class="nav-menu">
        <div class="menu-item">
            <button class="menu-btn">Меню</button>
            <div class="submenu">
                
                <a href="C:\Users\user\Desktop\Новая папка (4)/2.html">Галерея</a>
            </div>
        </div>
    </nav>

    <div class="content">
        <h1 style="color: white; margin-bottom: 30px;">SALOM</h1>
        <img src="C:\Users\user\Desktop\Новая папка (4)\3.jpg" class="main-photo" alt="Основное фото">
    </div>

    <div class="footer-text">
        <p>IT</p>
        <p>CENTR</p>
    </div>
</body>
</html>
